<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Hunter{% endblock %}</title>
  <style>
    :root {
      --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --muted:#8b94a7; --accent:#6ea8fe;
      --btn-fg:#0b0d12; --tag-red:#a55; --tag-green:#5a5; --ok-fg:#8d8; --ok-border:#5a5;
      --danger:#c88; --chip-hover-bd:#c66; --chip-hover-fg:#e99;
    }
    [data-theme="light"] {
      --bg:#f5f6f8; --panel:#ffffff; --line:#d8dce2; --fg:#1b1e24; --muted:#5b6472; --accent:#2563eb;
      --btn-fg:#ffffff; --tag-red:#b3352b; --tag-green:#1e7d3a; --ok-fg:#1e7d3a; --ok-border:#1e7d3a;
      --danger:#b3352b; --chip-hover-bd:#b3352b; --chip-hover-fg:#b3352b;
    }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
    header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
    nav a { color:var(--muted); text-decoration:none; margin-right:14px; }
    nav a.active, nav a:hover { color:var(--fg); }
    .grow { flex:1; }
    main { padding:22px; }
    a { color:var(--accent); }
    button, .btn { background:var(--accent); color:var(--btn-fg); border:0; padding:7px 13px; border-radius:7px; font-weight:600; cursor:pointer; }
    button.ghost { background:var(--panel); color:var(--fg); border:1px solid var(--line); }
    select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
    .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; background:var(--panel); border:1px solid var(--line); color:var(--muted); }
    .pill.on { border-color:var(--accent); color:var(--fg); }
    .score { font-variant-numeric:tabular-nums; font-weight:700; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
    tr:hover td { background:var(--panel); }
    .muted { color:var(--muted); }
    .reasons { color:var(--muted); font-size:12px; max-width:340px; }
    .filters { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    button.ghost.on { border-color:var(--ok-border); color:var(--ok-fg); }
    .chipbar { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; max-width:220px; }
    .chip { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; font-weight:500; cursor:pointer; }
    .chip:hover { border-color:var(--chip-hover-bd); color:var(--chip-hover-fg); }
    .reason-input { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; width:110px; }
  </style>
  <script>document.documentElement.dataset.theme = localStorage.getItem('jh-theme') || 'dark';</script>
</head>
<body>
  <header>
    <h1>🎯 Job Hunter <span class="muted" style="font-weight:400">· Paris ML</span></h1>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Table</a>
      <a href="/kanban" class="{% if request.url.path == '/kanban' %}active{% endif %}">Kanban</a>
      <a href="/rules" class="{% if request.url.path == '/rules' %}active{% endif %}">Rules</a>
    </nav>
    <span class="grow"></span>
    <button class="ghost" onclick="toggleTheme()" title="toggle light / dark theme">🌓</button>
    <form method="post" action="/run/fetch" style="margin:0">
      <button type="submit">⟳ Fetch new jobs</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    function toggleTheme() {
      const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('jh-theme', cur);
    }
    async function setStatus(sel, jobId) {
      const body = new URLSearchParams({ job_id: jobId, status: sel.value });
      const r = await fetch('/status', { method:'POST', body });
      sel.style.outline = r.ok ? '2px solid #35c46a' : '2px solid #e5534b';
      setTimeout(() => sel.style.outline = 'none', 700);
    }
    async function runAction(btn, url, ok) {
      btn.textContent = '…'; btn.disabled = true;
      try {
        const r = await fetch(url, { method:'POST' });
        const data = await r.json();
        if (ok(data)) { location.reload(); }
        else { btn.textContent = 'failed'; btn.disabled = false; }
      } catch (e) { btn.textContent = 'failed'; btn.disabled = false; }
    }
    const tailorCV = (btn, id) => runAction(btn, '/tailor/' + id, d => d.compiled);
    const judgeJob = (btn, id) => runAction(btn, '/judge/' + id, d => !d.error);
    const coverJob = (btn, id) => runAction(btn, '/cover/' + id, d => !d.error);
    const enrichJob = (btn, id) => runAction(btn, '/enrich/' + id, d => d.enriched);
    const restoreJob = (btn, id) => runAction(btn, '/filter/restore/' + id, d => d.ok);
    async function sendFeedback(id, label, reasons) {
      const body = new URLSearchParams({ label, reasons });
      const r = await fetch('/feedback/' + id, { method:'POST', body });
      if (r.ok) location.reload();
      return r.ok;
    }
    function toggleBar(id) {
      const e = document.getElementById(id);
      e.style.display = e.style.display === 'none' ? 'flex' : 'none';
    }
    const toggleLikes = (id) => toggleBar('likes-' + id);
    const toggleChips = (id) => toggleBar('chips-' + id);
    const dismissJob = (id, reason) => sendFeedback(id, 'dismissed', reason);
    const clearFeedback = (id) => sendFeedback(id, '', '');
    function submitLike(id) {
      const t = (document.getElementById('like-input-' + id).value || '').trim();
      sendFeedback(id, 'interested', t ? 'custom:' + t : '');
    }
    function submitDismissCustom(id) {
      const t = (document.getElementById('dismiss-input-' + id).value || '').trim();
      if (t) sendFeedback(id, 'dismissed', 'custom:' + t);
    }
    const approveRule = (btn, id) => runAction(btn, '/rules/' + id + '/approve', d => d.ok);
    const rejectRule = (btn, id) => runAction(btn, '/rules/' + id + '/reject', d => d.ok);
    async function uploadCV(input, id) {
      if (!input.files.length) return;
      const fd = new FormData();
      fd.append('pdf', input.files[0]);
      const r = await fetch('/cv/upload/' + id, { method:'POST', body: fd });
      if (r.ok) { location.reload(); } else { alert('upload failed'); }
    }
  </script>
</body>
</html>
