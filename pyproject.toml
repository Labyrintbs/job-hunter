[project]
name = "job-hunter"
version = "0.1.0"
description = "Paris ML-engineer job hunter: fetch, filter, tailor CVs, track applications"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# LLM via API key path (the claude CLI path needs no package). Cover-letter/judge
# also work through the local `claude` CLI with no extra install.
llm = ["anthropic>=0.40"]
# Reserved for the future LinkedIn logged-in fetch phase.
browser = ["playwright>=1.4"]
dev = ["pytest>=8.0", "playwright>=1.4"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunter"]
