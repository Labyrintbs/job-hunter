[project]
name = "job-hunter"
version = "0.1.0"
description = "Paris ML-engineer job hunter: fetch, filter, tailor CVs, track applications"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunter"]
