# Company ATS boards to pull directly (public JSON/XML, France-filtered at source).
# ats: greenhouse | lever | ashby | smartrecruiters | recruitee | workable | teamtailor | personio | successfactors
# token = the board slug in the ATS URL (for teamtailor/personio too -- same
# guessable-slug shape). Run `jobhunter discover` to auto-detect the ATS for
# companies already in your DB and propose additions here.
#
# ats: successfactors is different: token is the FULL recruiting-marketing
# hostname (e.g. "job.schindler.com"), not a slug -- it isn't derivable from the
# company name, so find it by hand (check the company's real career site) rather
# than guessing "companyname.successfactors.com" style, which will just 404.
#
# ats: workday is a different shape -- no single token, instead {tenant, wd_host,
# site, locale?}. See jobhunter/sources/workday.py's docstring for how to read
# these off a company's career page URL.
