# Search configuration for a Paris junior ML-engineer hunt (CDI, no internships).
query: "machine learning engineer"

# Title must contain one of these for a job to count as ML-relevant. Gates out
# non-ML roles from company ATS boards (whose boilerplate mentions "machine learning").
role_keywords:
  - machine learning
  - ml engineer
  - deep learning
  - data scientist
  - computer vision
  - nlp
  - mlops
  - ai engineer
  - applied ai
  - applied scientist
  - research engineer
  - research scientist
  - genai
  - generative ai
  - llm

# Extra keywords that boost a job's score if present in title/description.
boost_keywords:
  - machine learning
  - deep learning
  - ml engineer
  - computer vision
  - nlp
  - mlops
  - pytorch
  - data scientist

# Buckets shown as the dashboard's Category column. Checked title-first, then
# title+description, in this priority order (domain-specific before the ML/DL
# catch-all) -- see jobhunter/match.py:classify_role.
role_categories:
  NLP:
    - nlp
    - natural language processing
    - text mining
    - named entity
    - sentiment analysis
    - nlu
    - chatbot
    - conversational ai
  CV:
    - computer vision
    - image processing
    - object detection
    - image segmentation
    - opencv
    - visual recognition
    - point cloud
    - 3d vision
  AI:
    - genai
    - generative ai
    - llm
    - large language model
    - prompt engineering
    - rag
    - ai engineer
    - applied ai
    - artificial intelligence
  ML/DL:
    - machine learning
    - deep learning
    - ml engineer
    - mlops
    - data scientist
    - applied scientist
    - research engineer
    - research scientist

# Geography (WTTJ facet uses country; location text is matched against these).
countries: ["France"]
locations:
  - paris
  - ile-de-france
  - "île-de-france"
allow_remote_france: true

# Languages to keep (matched loosely against posting language / content).
languages: ["fr", "en"]

# Postings whose title/contract contains any of these are dropped (want CDI/full-time).
exclude_terms:
  - stage
  - stagiaire
  - internship
  - intern
  - alternance
  - apprenti
  - apprentissage
  - vie
  - freelance

# Companies to never show.
company_blocklist: []

# Auto-hide (Filtered bucket, not deleted) jobs that read as too senior for a junior.
# A junior/new-grad title always overrides this gate.
seniority:
  filter: true
  max_years: 3        # requires more than this many years -> Filtered

# Below this rule-based score (0-100) a job goes to the Filtered bucket, not the main list.
min_score: 20

# A job not seen in this many days of fetching (relative to the latest fetch run) is
# flagged stale/ghost — the posting has likely been taken down.
staleness_days: 14

# Max hits to request from WTTJ per run (applied per query below).
max_hits: 100

wttj:
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"

# LinkedIn public guest search (read-only, no login). Each query is searched in
# each location (a cross product), so 7 queries x 2 locations = 14 searches/run.
linkedin:
  enabled: true
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
  locations:
    - "Paris, France"
    - "Île-de-France, France"
  recent_hours: 168   # last 7 days
  max_pages: 5
  max_retries: 3       # retries on 429 before giving up on a page
  backoff_seconds: 2.0

# France Travail (Pôle emploi) official API — needs a free key, see README.
# Credentials: FRANCE_TRAVAIL_CLIENT_ID / FRANCE_TRAVAIL_CLIENT_SECRET env vars.
# Silently contributes nothing until those are set.
francetravail:
  enabled: true
  departements: "75,92,93,94,77,78,91,95"   # Île-de-France
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"

# HelloWork — page-1 only (~30 results/query), see jobhunter/sources/hellowork.py
# docstring for why pagination isn't attempted.
hellowork:
  enabled: true
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
  locations:
    - "Paris"

# Notify about new jobs after each scheduled run.
# 'file' always works (writes data/notifications/); telegram/email need env creds.
notifications:
  enabled: true
  min_score: 60       # only notify jobs at/above this effective score
  channels: [file]    # add: telegram, email
