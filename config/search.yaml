# Search configuration for a Paris junior ML-engineer hunt (CDI, no internships).
query: "machine learning engineer"

# Title must contain one of these for a job to count as ML-relevant. Gates out
# non-ML roles from company ATS boards (whose boilerplate mentions "machine learning").
role_keywords:
  - machine learning
  - ml engineer
  - deep learning
  - data scientist
  - computer vision
  - nlp
  - mlops
  - ai engineer
  - applied ai
  - applied scientist
  - research engineer
  - research scientist
  - genai
  - generative ai
  - llm
  - algorithm engineer

# Extra keywords that boost a job's score if present in title/description.
boost_keywords:
  - machine learning
  - deep learning
  - ml engineer
  - computer vision
  - nlp
  - mlops
  - pytorch
  - data scientist
  - llm
  - genai
  - generative ai
  - rag
  - applied ai
  - agentic

# Buckets shown as the dashboard's Category column. Checked title-first, then
# title+description, in this priority order (domain-specific before the ML/DL
# catch-all) -- see jobhunter/match.py:classify_role.
role_categories:
  NLP:
    - nlp
    - natural language processing
    - text mining
    - named entity
    - sentiment analysis
    - nlu
    - chatbot
    - conversational ai
  CV:
    - computer vision
    - image processing
    - object detection
    - image segmentation
    - opencv
    - visual recognition
    - point cloud
    - 3d vision
  AI:
    - genai
    - generative ai
    - llm
    - large language model
    - prompt engineering
    - rag
    - ai engineer
    - applied ai
    - artificial intelligence
  ML/DL:
    - machine learning
    - deep learning
    - ml engineer
    - mlops
    - data scientist
    - applied scientist
    - research engineer
    - research scientist

# Geography (WTTJ facet uses country; location text is matched against these).
countries: ["France"]
locations:
  - paris
  - ile-de-france
  - "île-de-france"
  # Paris-region suburbs that show up bare (no "Paris"/"France" in the string) on
  # large-corporate ATS boards, esp. Workday -- see ats.py's FRANCE_HINTS.
  - guyancourt
  - "vélizy"
  - velizy
  - boulogne-billancourt
  - issy-les-moulineaux
  - rueil-malmaison
  - nanterre
  - "la défense"
  - la defense
  - saint-ouen
  - levallois-perret
  - courbevoie
  - massy
  - saclay
  - "évry"
  - evry
  - aubevoye
  - lardy
allow_remote_france: true

# Major French tech hubs outside Paris/IDF -- candidate is open to relocating.
# Scored below Paris/IDF but above a vague "somewhere in France" hit, see
# major_city_bonus and jobhunter/match.py's geo_tier().
major_cities:
  - lyon
  - toulouse
  - grenoble
  - "sophia antipolis"
  - nice
  - lille
  - nantes
  - bordeaux
  - rennes
  - montpellier
  - strasbourg
major_city_bonus: 14

# Languages to keep (matched loosely against posting language / content).
languages: ["fr", "en"]

# Postings whose title/contract contains any of these are dropped (want CDI/full-time).
exclude_terms:
  - stage
  - stagiaire
  - internship
  - intern
  - alternance
  - apprenti
  - apprentissage
  - vie
  - freelance
  - indépendant
  - independant
  - portage salarial

# Companies to never show.
company_blocklist: []

# Auto-hide (Filtered bucket, not deleted) jobs that read as too senior for a junior.
# A junior/new-grad title always overrides this gate.
seniority:
  filter: true
  max_years: 3        # requires more than this many years -> Filtered

# Below this rule-based score (0-100) a job goes to the Filtered bucket, not the main list.
min_score: 20

# A job not seen in this many days of fetching (relative to the latest fetch run) is
# flagged stale/ghost — the posting has likely been taken down.
staleness_days: 14

# Max hits to request from WTTJ per run (applied per query below). WTTJ paginates
# through real Algolia matches (not a frozen relevance ranking like LinkedIn/HelloWork),
# so depth here is genuine coverage, not guesswork -- verified nbHits directly per query
# (ai engineer: 3408 total, capped by Algolia's own 1000-hit engine ceiling; data
# scientist: 264; llm engineer: 263), all far past the old 100 cap.
max_hits: 300

wttj:
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"

# LinkedIn public guest search (read-only, no login). Each query is searched in
# each location (a cross product); "France" (not city-specific) returns genuine
# nationwide results -- verified directly -- covering major hubs (Lyon, Lille,
# Strasbourg, Montpellier, ...) in one request instead of one per city.
linkedin:
  enabled: true
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "mlops engineer"   # replaced "ai engineer": measured 93% overlap with the other
                          # 7 queries (near-zero unique contribution); "mlops engineer"
                          # matches a title pattern (9 hits in the same sample) no query covered
  locations:
    - "France"
  recent_hours: 168   # last 7 days -- verified the 24h pool is only ~23% of the 7-day
                       # one, flat across depth (not front-loaded), so don't shrink this
  max_pages: 10        # up from 5 -- verified no decay cliff through page 20, still
                        # finding new/relevant results; zero 429s at this depth
  max_retries: 3       # retries on 429 before giving up on a page
  backoff_seconds: 2.0

# France Travail (Pôle emploi) official API — needs a free key, see README.
# Credentials: FRANCE_TRAVAIL_CLIENT_ID / FRANCE_TRAVAIL_CLIENT_SECRET env vars.
# Silently contributes nothing until those are set.
francetravail:
  enabled: true
  # Île-de-France (75,92,93,94,77,78,91,95) plus major hubs: 69 Lyon, 31 Toulouse,
  # 38 Grenoble, 06 Nice/Sophia Antipolis, 59 Lille, 44 Nantes, 33 Bordeaux,
  # 35 Rennes, 34 Montpellier, 67 Strasbourg.
  departements: "75,92,93,94,77,78,91,95,69,31,38,06,59,44,33,35,34,67"
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"

# HelloWork — page-1 only (~30 results/query), see jobhunter/sources/hellowork.py
# docstring for why pagination isn't attempted. "France" (verified directly)
# returns genuine nationwide results, not just Paris.
hellowork:
  enabled: true
  # Verified: HelloWork's top-30 is a stable, relevance-ranked (not recency-ranked)
  # slice -- zero new jobs found across 10 straight runs. More queries = more
  # independent rankings = the only real lever within the robots.txt-imposed no-
  # pagination constraint (see hellowork.py's docstring).
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
  locations:
    - "France"

# Notify about new jobs after each scheduled run.
# 'file' always works (writes data/notifications/); telegram/email need env creds.
notifications:
  enabled: true
  min_score: 60       # only notify jobs at/above this effective score
  channels: [file]    # add: telegram, email
