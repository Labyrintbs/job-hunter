# Search configuration for a Paris junior ML-engineer hunt (CDI/CDD, no internships).
query: "machine learning engineer"

# role_categories/general_keywords/category_weights and every scoring point
# value (geo/language/seniority/client-facing bonuses, min_score, depth bonus)
# now live in config/scoring.yaml -- this file keeps fetch-source config and
# filter *criteria* (which locations/languages/terms/companies count at all),
# not the numbers that score them.

# Geography (WTTJ facet uses country; location text is matched against these).
countries: ["France"]
locations:
  - paris
  - ile-de-france
  - "île-de-france"
  # Paris-region suburbs that show up bare (no "Paris"/"France" in the string) on
  # large-corporate ATS boards, esp. Workday -- see ats.py's FRANCE_HINTS.
  - guyancourt
  - "vélizy"
  - velizy
  - boulogne-billancourt
  - issy-les-moulineaux
  - rueil-malmaison
  - nanterre
  - "la défense"
  - la defense
  - saint-ouen
  - levallois-perret
  - courbevoie
  - massy
  - saclay
  - "évry"
  - evry
  - aubevoye
  - lardy
allow_remote_france: true

# Major French tech hubs outside Paris/IDF -- candidate is open to relocating.
# Scored below Paris/IDF but above a vague "somewhere in France" hit, see
# major_city_bonus and jobhunter/match.py's geo_tier().
major_cities:
  - lyon
  - toulouse
  - grenoble
  - "sophia antipolis"
  - nice
  - lille
  - nantes
  - bordeaux
  - rennes
  - montpellier
  - strasbourg

# EU member states (excluding France) for "fully remote at an EU company,
# candidate stays in France" postings, matched against WTTJ's offices.country
# facet. Legal hireability (EOR vs entity vs foreign payroll) can't be told from
# a JD -- these surface like any posting, not auto-vetted; check each manually.
europe_countries:
  - Germany
  - Spain
  - Italy
  - Netherlands
  - Belgium
  - Portugal
  - Ireland
  - Poland
  - Austria
  - Sweden
  - Denmark
  - Finland
  - Czechia
  - Hungary
  - Romania
  - Bulgaria
  - Croatia
  - Greece
  - Slovakia
  - Slovenia
  - Lithuania
  - Latvia
  - Estonia
  - Luxembourg
  - Malta
  - Cyprus
allow_remote_europe: true

# Languages to keep (matched loosely against posting language / content).
languages: ["fr", "en"]

# Postings whose title/contract contains any of these are dropped (want full-time, CDI or CDD).
exclude_terms:
  - stage
  - stagiaire
  - internship
  - intern
  - alternance
  - apprenti
  - apprentissage
  - vie
  - freelance
  - indépendant
  - independant
  - portage salarial

# Companies to never show.
company_blocklist: []

# Auto-hide (Filtered bucket, not deleted) jobs that read as too senior for a junior.
# A junior/new-grad title always overrides this gate.
seniority:
  filter: true
  max_years: 3        # requires more than this many years -> Filtered

# A job not seen in this many days of fetching (relative to the latest fetch run) is
# flagged stale/ghost — the posting has likely been taken down.
staleness_days: 14

# Max hits per query from WTTJ. It paginates through real Algolia matches (not a
# frozen relevance ranking like LinkedIn/HelloWork), capped at Algolia's own
# 1000-hit ceiling -- far past the old 100 cap, so depth here is genuine coverage.
max_hits: 300

wttj:
  # Real server-side pagination (not a frozen relevance ranking) with proven high
  # volume -- worth checking more often than a source like HelloWork whose
  # visible results barely change hour to hour.
  fetch_interval_hours: 3
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  # Second pass per query: WTTJ's own remote:fulltime facet, restricted to
  # europe_countries above -- a real employer-declared field, not a text guess.
  # Counts stay bounded, not an explosion (see europe_remote_max_hits).
  fetch_europe_remote: true
  europe_remote_max_hits: 100

# LinkedIn public guest search (read-only, no login). Each query is searched in
# each location (a cross product); "France" (not city-specific) returns genuine
# nationwide results covering major hubs in one request instead of one per city.
linkedin:
  enabled: true
  # No decay cliff through page 20, zero 429s at 83 requests/experiment -- real
  # headroom worth checking more often than a source that's already saturated.
  fetch_interval_hours: 3
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "mlops engineer"   # high overlap with the other queries, but cross-query
                          # duplicates are free (dedup via external_id) and this one
                          # matches a title pattern none of the others cover.
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  locations:
    - "France"
  recent_hours: 168   # last 7 days -- the 24h pool is a small, flat-across-depth
                       # slice of the 7-day one (not front-loaded), so don't shrink this
  max_pages: 10        # up from 5 -- verified no decay cliff through page 20, still
                        # finding new/relevant results; zero 429s at this depth
  max_retries: 3       # retries on 429 before giving up on a page
  backoff_seconds: 2.0
  # Region pass: the "France" search above ranks Paris first and runs out of depth, so each
  # other metropolitan region is searched on its own (fewer queries and pages per region).
  regions:
    enabled: true
    queries:
      - "machine learning engineer"
      - "deep learning engineer"
      - "nlp engineer"
      - "computer vision engineer"
      - "ai engineer"
      - "data scientist"
    locations:
      - "Auvergne-Rhône-Alpes, France"
      - "Occitanie, France"
      - "Nouvelle-Aquitaine, France"
      - "Provence-Alpes-Côte d'Azur, France"
      - "Hauts-de-France, France"
      - "Pays de la Loire, France"
      - "Bretagne, France"
      - "Grand Est, France"
      - "Normandie, France"
      - "Bourgogne-Franche-Comté, France"
      - "Centre-Val de Loire, France"
    max_pages: 3
  # Second pass: location "Europe", f_WT=2 as a coarse noise-reducer only (it lets
  # non-remote postings through) -- real remote status is confirmed later from the
  # JD text (see match.detect_remote_from_text, pipeline.enrich_one).
  europe_remote:
    enabled: true
    locations:
      - "Europe"
    workplace_type: "2"
    max_pages: 5

# France Travail (Pôle emploi) official API — needs a free key, see README.
# Credentials: FRANCE_TRAVAIL_CLIENT_ID / FRANCE_TRAVAIL_CLIENT_SECRET env vars.
# Silently contributes nothing until those are set.
francetravail:
  enabled: true
  # Moot while FRANCE_TRAVAIL_CLIENT_ID/SECRET stay unset (fetch() returns []
  # immediately either way) -- set for consistency and for whenever it's revived.
  fetch_interval_hours: 12
  # Empty = the whole of France (no departement filter).
  departements: ""
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"

# HelloWork — page-1 only (~30 results/query), see jobhunter/sources/hellowork.py
# docstring for why pagination isn't attempted. "France" returns genuine
# nationwide results, not just Paris.
hellowork:
  enabled: true
  # HelloWork's top-30 is a stable, relevance-ranked (not recency-ranked) slice --
  # zero new jobs found across 10 straight runs. More queries is the only real
  # lever within the robots.txt no-pagination constraint (see hellowork.py).
  fetch_interval_hours: 24
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  locations:
    - "France"

# Arbeitnow — free public API, no key/login. Real pan-European coverage (not
# Germany-only), each record ships its full description already. No server-side
# keyword search exists, so match.py's screen() filters the whole feed (same as
# ats.py/hellowork.py). The API's own remote=true param doesn't filter -- each
# record's own `remote` field (employer-declared) is used instead.
arbeitnow:
  enabled: true
  fetch_interval_hours: 12
  max_pages: 20   # 250 jobs/page = 5,000 scanned/poll; real observed new-relevant-jobs
                  # per run has never exceeded 20 (see fetch_runs history), so this is
                  # a wide safety margin, not a response to an observed shortfall

# EURES (official EU job mobility portal) -- reverse-engineered public API, no
# key. locationCodes=["fr"] is an exact server-side filter, not a text heuristic.
# Not recency-sorted (a July posting surfaced in a September top-20), and volume
# is huge relative to this shallow poll -- see eures_backfill for the deeper sweep.
eures:
  enabled: true
  fetch_interval_hours: 6
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  max_hits: 200

# artificialintelligencejobs.co -- niche AI/ML-focused public API, no key.
# Genuinely recency-sorted, and volume for these queries is small enough that
# max_hits already covers it -- no backfill needed.
aijobs:
  enabled: true
  fetch_interval_hours: 12
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
  max_hits: 100

# Free-Work (free-work.com) -- French tech/IT board, plain server-rendered HTML
# + full schema.org JobPosting per job (only French-language source tested with
# structured salary). Not recency-sorted, so (like HelloWork) a deeper periodic
# walk wouldn't buy freshness -- no backfill, capped as a polite visitor.
free_work:
  enabled: true
  fetch_interval_hours: 12
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
  max_detail_fetches: 45

# lesjeudis.com -- historic French tech job board, same plain-HTML +
# JobPosting-JSON-LD shape as Free-Work, same no-backfill reasoning.
lesjeudis:
  enabled: true
  fetch_interval_hours: 12
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
  max_detail_fetches: 45

# Deep sweep (`jobhunter backfill`) -- separate from the regular shallow polls
# above. Split Saturday (arbeitnow, wttj, eures) / Sunday (workday, francetravail,
# linkedin_wide) -- see pipeline.BACKFILL_GROUPS. Most streams walk fully every
# run (no cursor -- a saved offset can't survive a week of new postings); dedup
# makes the overlap harmless. francetravail's date window is calendar-anchored
# instead, so a cursor safely resumes without an unbounded weekly sweep of an
# authenticated API.
arbeitnow_backfill:
  enabled: true
  fetch_interval_hours: 168    # once a week
  max_pages: 100                # moderate estimate, not a confirmed archive size --
                                 # probing further live triggered a real HTTP 429

wttj_backfill:
  enabled: true
  fetch_interval_hours: 168
  max_hits: 1100                # covers Algolia's real per-query ceiling (observed max ~1,020)

workday_backfill:
  enabled: true
  fetch_interval_hours: 168
  pages_per_query: 15           # covers the real observed max (Airbus/"machine learning" = 186)

francetravail_backfill:
  enabled: true
  fetch_interval_hours: 168
  window_days: 90
  rewalk_after_days: 7          # once fully caught up, re-walk weekly to catch anything a gap missed

linkedin_backfill:
  enabled: true
  fetch_interval_hours: 168
  wide_recent_hours: 720        # 30 days, vs. the regular poll's 168 (7 days)

eures_backfill:
  enabled: true
  fetch_interval_hours: 168
  max_hits: 2000                 # moderate multiple, not near-complete coverage --
                                  # no recency-sort override exists (see eures:
                                  # above), so this buys raw coverage, not freshness

# Workday-hosted company boards (config/companies.yaml, ats: workday) -- Workday's
# search API only returns postings matching one of these phrases (unlike
# Greenhouse/Lever's full-board fetch), so a missing category is invisible no
# matter how many real postings exist (e.g. Valeo returned zero computer-vision
# postings before "computer vision" was added here). Fetch cadence follows
# `ats.fetch_interval_hours` below, not its own.
workday:
  queries:
    - "machine learning"
    - "deep learning"
    - "data scientist"
    - "algorithm engineer"
    - "artificial intelligence"
    - "computer vision"
    - "nlp"
    - "llm"
    - "generative ai"
    - "ai product manager"
    - "technical product manager"

# Company ATS boards (config/companies.yaml) -- no query/location block needed here,
# just a fetch cadence. Career pages change slowly (a handful of new roles a week),
# so checking hourly like LinkedIn/WTTJ would be pure waste.
ats:
  fetch_interval_hours: 12

# Notify about new jobs after each scheduled run.
# 'file' always works (writes data/notifications/); telegram/email need env creds.
notifications:
  enabled: true
  min_score: 60       # only notify jobs at/above this effective score
  channels: [file]    # add: telegram, email

# Daily France-Travail-backed market-demand snapshot (jobhunter/market_trend.py)
# -- a standalone dataset tracking the whole IT/CS market, independent of
# francetravail.queries above. Categories are France Travail's own domaine/ROME
# codes (see /referentiel/domaines, /referentiel/metiers) -- domaine:M18 is the
# official aggregate for the whole IT/telecom domain. Needs the same
# FRANCE_TRAVAIL_CLIENT_ID/SECRET as francetravail above.
market_trend:
  enabled: true
  idf_departements: "75,92,93,94,77,78,91,95"
  categories:
    - { label: "Whole IT/CS market", param: domaine, code: M18 }
    - { label: "Software development", param: codeROME, code: M1805 }
    - { label: "Data engineering", param: codeROME, code: M1811 }
    - { label: "AI engineering", param: codeROME, code: M1889 }
    - { label: "DevOps", param: codeROME, code: M1827 }
    - { label: "Cybersecurity", param: codeROME, code: M1856 }
