# Search configuration for a Paris junior ML-engineer hunt (CDI/CDD, no internships).
query: "machine learning engineer"

# Title must contain one of these for a job to count as ML-relevant. Gates out
# non-ML roles from company ATS boards (whose boilerplate mentions "machine learning").
role_keywords:
  - machine learning
  - ml engineer
  - deep learning
  - data scientist
  - computer vision
  - nlp
  - mlops
  - ai engineer
  - applied ai
  - applied scientist
  - research engineer
  - research scientist
  - genai
  - generative ai
  - llm
  - algorithm engineer

# AI/Technical Product Manager roles -- a second acceptable target alongside ML
# engineering (see jobhunter/llm/judge.py's SYSTEM prompt for how these are judged).
# Deliberately compound phrases, not bare "product manager", so a generic PM
# posting unrelated to AI/ML doesn't pass this gate.
  - ai product manager
  - product manager ai
  - technical product manager
  - ml product manager
  - genai product manager
  - product manager llm
  - ai product owner
  - technical product owner
  - chef de produit ia
  - chef de produit - ia

# Extra keywords that boost a job's score if present in title/description.
boost_keywords:
  - machine learning
  - deep learning
  - ml engineer
  - computer vision
  - opencv
  - segmentation
  - object detection
  - point cloud
  - image processing
  - medical imaging
  - nlp
  - mlops
  - pytorch
  - data scientist
  - llm
  - genai
  - generative ai
  - rag
  - applied ai
  - agentic

# Buckets shown as the dashboard's Category column. Checked title-first, then
# title+description, in this priority order (domain-specific before the ML/DL
# catch-all) -- see jobhunter/match.py:classify_role.
role_categories:
  NLP:
    - nlp
    - natural language processing
    - text mining
    - named entity
    - sentiment analysis
    - nlu
    - chatbot
    - conversational ai
  CV:
    - computer vision
    - image processing
    - object detection
    - image segmentation
    - opencv
    - visual recognition
    - point cloud
    - 3d vision
    - medical imaging
    - slam
    - 3d reconstruction
  AI:
    - genai
    - generative ai
    - llm
    - large language model
    - prompt engineering
    - rag
    - ai engineer
    - applied ai
    - artificial intelligence
  ML/DL:
    - machine learning
    - deep learning
    - ml engineer
    - mlops
    - data scientist
    - applied scientist
    - research engineer
    - research scientist
  PM:
    - ai product manager
    - product manager ai
    - technical product manager
    - ml product manager
    - genai product manager
    - product manager llm
    - ai product owner
    - technical product owner
    - chef de produit ia
    - chef de produit - ia

# Geography (WTTJ facet uses country; location text is matched against these).
countries: ["France"]
locations:
  - paris
  - ile-de-france
  - "île-de-france"
  # Paris-region suburbs that show up bare (no "Paris"/"France" in the string) on
  # large-corporate ATS boards, esp. Workday -- see ats.py's FRANCE_HINTS.
  - guyancourt
  - "vélizy"
  - velizy
  - boulogne-billancourt
  - issy-les-moulineaux
  - rueil-malmaison
  - nanterre
  - "la défense"
  - la defense
  - saint-ouen
  - levallois-perret
  - courbevoie
  - massy
  - saclay
  - "évry"
  - evry
  - aubevoye
  - lardy
allow_remote_france: true

# Major French tech hubs outside Paris/IDF -- candidate is open to relocating.
# Scored below Paris/IDF but above a vague "somewhere in France" hit, see
# major_city_bonus and jobhunter/match.py's geo_tier().
major_cities:
  - lyon
  - toulouse
  - grenoble
  - "sophia antipolis"
  - nice
  - lille
  - nantes
  - bordeaux
  - rennes
  - montpellier
  - strasbourg
major_city_bonus: 14

# Any other named French city (not IDF, not a major hub above) -- always a real,
# opportunistic part of the search now, not gated behind allow_remote_france.
# Below major_city_bonus so the curated hubs still win.
other_france_bonus: 10

# EU member states (excluding France, already in scope above) recognized for
# "fully remote at an EU company, candidate stays based in France" postings.
# Matched against WTTJ's real offices.country facet values. Whether a given
# employer can legally hire someone living in France (EOR vs French entity vs
# direct foreign payroll) can't be told from a job description -- these are
# surfaced like any other posting, not auto-vetted; the candidate checks each
# one manually before applying.
europe_countries:
  - Germany
  - Spain
  - Italy
  - Netherlands
  - Belgium
  - Portugal
  - Ireland
  - Poland
  - Austria
  - Sweden
  - Denmark
  - Finland
  - Czechia
  - Hungary
  - Romania
  - Bulgaria
  - Croatia
  - Greece
  - Slovakia
  - Slovenia
  - Lithuania
  - Latvia
  - Estonia
  - Luxembourg
  - Malta
  - Cyprus
allow_remote_europe: true

# No relocation at all, but real unresolved per-employer legal/payroll
# uncertainty -- between other_france_bonus and major_city_bonus.
europe_remote_bonus: 12

# Languages to keep (matched loosely against posting language / content).
languages: ["fr", "en"]

# Postings whose title/contract contains any of these are dropped (want full-time, CDI or CDD).
exclude_terms:
  - stage
  - stagiaire
  - internship
  - intern
  - alternance
  - apprenti
  - apprentissage
  - vie
  - freelance
  - indépendant
  - independant
  - portage salarial

# Companies to never show.
company_blocklist: []

# Auto-hide (Filtered bucket, not deleted) jobs that read as too senior for a junior.
# A junior/new-grad title always overrides this gate.
seniority:
  filter: true
  max_years: 3        # requires more than this many years -> Filtered

# Below this rule-based score (0-100) a job goes to the Filtered bucket, not the main list.
min_score: 20

# A job not seen in this many days of fetching (relative to the latest fetch run) is
# flagged stale/ghost — the posting has likely been taken down.
staleness_days: 14

# Max hits to request from WTTJ per run (applied per query below). WTTJ paginates
# through real Algolia matches (not a frozen relevance ranking like LinkedIn/HelloWork),
# so depth here is genuine coverage, not guesswork -- verified nbHits directly per query
# (ai engineer: 3408 total, capped by Algolia's own 1000-hit engine ceiling; data
# scientist: 264; llm engineer: 263), all far past the old 100 cap.
max_hits: 300

wttj:
  # Real server-side pagination (not a frozen relevance ranking) and proven large
  # unused volume (up to 3408 hits/query) -- worth checking more often than a
  # source like HelloWork whose visible results barely change hour to hour.
  fetch_interval_hours: 3
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  # Second pass per query: WTTJ's own remote:fulltime facet, restricted to
  # europe_countries above -- a real employer-declared field, not a text guess.
  # Verified live counts (no country restriction): ai engineer 329, AI product
  # manager 70, llm engineer 17, technical product manager 10, data scientist 4,
  # computer vision engineer 3 -- bounded, not an explosion.
  fetch_europe_remote: true
  europe_remote_max_hits: 100

# LinkedIn public guest search (read-only, no login). Each query is searched in
# each location (a cross product); "France" (not city-specific) returns genuine
# nationwide results -- verified directly -- covering major hubs (Lyon, Lille,
# Strasbourg, Montpellier, ...) in one request instead of one per city.
linkedin:
  enabled: true
  # No decay cliff through page 20, zero 429s at 83 requests/experiment -- real
  # headroom worth checking more often than a source that's already saturated.
  fetch_interval_hours: 3
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "mlops engineer"   # "ai engineer" measured 93% overlap with the other queries
                          # (near-zero unique contribution) but kept anyway -- cross-
                          # query duplicates are free (dedup via external_id) and we're
                          # nowhere near a rate limit, so there's no reason to trade
                          # away its small remaining unique yield. "mlops engineer"
                          # added new: matches a title pattern no other query covered.
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  locations:
    - "France"
  recent_hours: 168   # last 7 days -- verified the 24h pool is only ~23% of the 7-day
                       # one, flat across depth (not front-loaded), so don't shrink this
  max_pages: 10        # up from 5 -- verified no decay cliff through page 20, still
                        # finding new/relevant results; zero 429s at this depth
  max_retries: 3       # retries on 429 before giving up on a page
  backoff_seconds: 2.0
  # Second pass: location "Europe", f_WT=2 as a coarse noise-reducer only -- verified
  # live that f_WT=2 lets non-remote postings through (a "Hybrid" job came back under
  # it), so results keep their real, untouched location; genuine remote status is
  # confirmed later from the full JD text once enriched (see match.detect_remote_from_text,
  # pipeline.enrich_one). max_pages kept at half the main pass as a conservative start.
  europe_remote:
    enabled: true
    locations:
      - "Europe"
    workplace_type: "2"
    max_pages: 5

# France Travail (Pôle emploi) official API — needs a free key, see README.
# Credentials: FRANCE_TRAVAIL_CLIENT_ID / FRANCE_TRAVAIL_CLIENT_SECRET env vars.
# Silently contributes nothing until those are set.
francetravail:
  enabled: true
  # Moot while FRANCE_TRAVAIL_CLIENT_ID/SECRET stay unset (fetch() returns []
  # immediately either way) -- set for consistency and for whenever it's revived.
  fetch_interval_hours: 12
  # Île-de-France (75,92,93,94,77,78,91,95) plus major hubs: 69 Lyon, 31 Toulouse,
  # 38 Grenoble, 06 Nice/Sophia Antipolis, 59 Lille, 44 Nantes, 33 Bordeaux,
  # 35 Rennes, 34 Montpellier, 67 Strasbourg.
  departements: "75,92,93,94,77,78,91,95,69,31,38,06,59,44,33,35,34,67"
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"

# HelloWork — page-1 only (~30 results/query), see jobhunter/sources/hellowork.py
# docstring for why pagination isn't attempted. "France" (verified directly)
# returns genuine nationwide results, not just Paris.
hellowork:
  enabled: true
  # Verified: HelloWork's top-30 is a stable, relevance-ranked (not recency-ranked)
  # slice -- zero new jobs found across 10 straight runs. More queries = more
  # independent rankings = the only real lever within the robots.txt-imposed no-
  # pagination constraint (see hellowork.py's docstring). Checking more often than
  # once a day doesn't help -- the visible slice barely changes hour to hour.
  fetch_interval_hours: 24
  queries:
    - "machine learning engineer"
    - "deep learning engineer"
    - "nlp engineer"
    - "computer vision engineer"
    - "ai engineer"
    - "llm engineer"
    - "data scientist"
    - "algorithm engineer"
    - "AI product manager"
    - "technical product manager"
    - "chef de produit IA"
  locations:
    - "France"

# Arbeitnow — free public API, no key/login. Real pan-European coverage (Berlin,
# London, Paris, Munich, Hamburg, ... -- verified live, not Germany-only), each
# record ships its full description already. No server-side keyword search exists
# (verified against the docs and live) -- match.py's screen() filters relevance
# from the whole feed, same as ats.py/hellowork.py for sources without a query
# param. The API's own remote=true param does NOT filter (verified live: identical
# results with/without it) -- never passed; each record's own `remote` field
# (employer-declared) is used instead, same category of signal as wttj's facet.
arbeitnow:
  enabled: true
  fetch_interval_hours: 12
  max_pages: 10   # 250 jobs/page; modest relevant-hit density (general job board,
                  # not ML-specific) but real, free, and legitimate additional EU spread

# Company ATS boards (config/companies.yaml) -- no query/location block needed here,
# just a fetch cadence. Career pages change slowly (a handful of new roles a week),
# so checking hourly like LinkedIn/WTTJ would be pure waste.
ats:
  fetch_interval_hours: 12

# Notify about new jobs after each scheduled run.
# 'file' always works (writes data/notifications/); telegram/email need env creds.
notifications:
  enabled: true
  min_score: 60       # only notify jobs at/above this effective score
  channels: [file]    # add: telegram, email

# Daily France-Travail-backed market-demand snapshot (jobhunter/market_trend.py) --
# a standalone dataset tracking the whole IT/CS market, independent of the
# francetravail.queries used above for actual candidate fetching. Categories are
# France Travail's own domaine/ROME codes (see /referentiel/domaines,
# /referentiel/metiers), not free-text keyword guesses -- domaine:M18 is the
# official aggregate for the whole "Systemes d'information et de telecommunication"
# domain; the codeROME entries are a representative slice of it. Needs the same
# FRANCE_TRAVAIL_CLIENT_ID/SECRET as francetravail above.
market_trend:
  enabled: true
  idf_departements: "75,92,93,94,77,78,91,95"
  categories:
    - { label: "Whole IT/CS market", param: domaine, code: M18 }
    - { label: "Software development", param: codeROME, code: M1805 }
    - { label: "Data engineering", param: codeROME, code: M1811 }
    - { label: "AI engineering", param: codeROME, code: M1889 }
    - { label: "DevOps", param: codeROME, code: M1827 }
    - { label: "Cybersecurity", param: codeROME, code: M1856 }
