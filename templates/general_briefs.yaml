# Presets for `jobhunter tailor-general`: a CV for no particular company (job fair, networking).
#
# brief:        stands in for the job posting; every CV bullet is scored against it. The LLM only
#               picks and ranks existing content, so a brief never adds anything to the CV.
# experiences:  optional, fixes the internships shown (names as in the master, one entry each;
#               "a|b" accepts either spelling, so one name works in the English and French master).
# projects:     optional, fixes the projects shown, in the order listed.
# Without pins, the LLM chooses from the brief.

llm:
  brief: |
    A general CV handed to any employer at a job fair, aimed at LLM / generative AI engineer roles.
    Favour hands-on evidence of working with large language models: fine-tuning (SFT, GRPO, LoRA),
    evaluation (LLM-as-a-judge, failure analysis, held-out gates), agentic pipelines (LangGraph,
    prompt frameworks), structured output, inference cost and latency, and building end-to-end
    working systems in Python. Computer vision work is background only. The CV must not mention
    any company being applied to.
  experiences: [DiliTrust, DeepWise]

llm-speech:
  brief: |
    The same general LLM / generative AI CV as the llm preset, but showing the self-supervised
    speech internship as the second experience: representation learning, distributed training,
    cross-lingual evaluation. The CV must not mention any company being applied to.
  experiences: [DiliTrust, Orange Labs]

cv:
  brief: |
    A general CV handed to any employer at a job fair, aimed at computer vision and medical imaging
    engineer roles. Favour hands-on evidence in image and 3D understanding: segmentation and
    classification with CNNs, medical imaging (CT, CTA, clinical datasets, annotation workflows,
    class imbalance), 3D point cloud registration, benchmarking and failure diagnosis, PyTorch and
    OpenCV. LLM work is background only. The CV must not mention any company being applied to.
  experiences: [DiliTrust, DeepWise]
  projects: ["Job Hunter", "Point Cloud|nuages de points", "Polyps|polypes"]

medical:
  brief: |
    A CV for the founder of a medical AI startup (retinal imaging, clinical decision support), who
    is not an ML engineer and reads it to judge a possible technical collaborator. Favour medical
    imaging: biomedical imaging coursework, CT and CTA segmentation, clinical datasets and
    annotation workflows, class imbalance, failure diagnosis and validation. LLM work matters
    where it shows rigorous evaluation (held-out gates, failure taxonomy) and fine-tuning.
    Computer vision outside medicine is background only. The CV must not mention any company.
  experiences: [DeepWise, DiliTrust]
  projects: ["Polyps|polypes", "Point Cloud|nuages de points", "Job Hunter"]
